server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compression for text-y assets
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        application/atom+xml
        application/rss+xml;

    # Astro emits hashed filenames under /_astro/ - safe to cache forever
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Pagefind search index - cache briefly
    location /pagefind/ {
        expires 1h;
        add_header Cache-Control "public";
    }

    # Everything else: try the URI, then URI/, then URI.html
    # HTML responses must always revalidate so deploys take effect immediately
    location / {
        try_files $uri $uri/ $uri.html =404;
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    # Use Starlight's built-in 404 page
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
