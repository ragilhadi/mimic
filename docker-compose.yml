services:
  mimic:
    image: ragilhadi/mimic:latest
    container_name: mimic
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    volumes:
      - ./mocks:/app/mocks:ro
    environment:
      - PORT=${PORT:-8080}
      - RUST_LOG=${RUST_LOG:-info}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -q --spider http://localhost:$${PORT:-8080}/health || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
