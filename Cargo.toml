[package]
name = "mimic"
version = "1.15.0"
edition = "2021"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["trace"] }
http-body-util = "0.1.4"
regex = "1.13"
urlencoding = "2.1"
bytes = "1.12.1"
chrono = { version = "0.4.45", features = ["serde"] }
rand = "0.10"
serde_yaml = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

[dev-dependencies]
tempfile = "3"
http-body = "1"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1.4"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
# panic = "abort"  # Disabled: causes silent exits, makes debugging hard
strip = false  # Keep symbols for now to help with debugging
