<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mimic – Request Dashboard</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0f1117;--surface:#1a1d27;--border:#2a2d3a;--text:#e1e4ed;--muted:#8b8fa3;--accent:#6c63ff;--green:#22c55e;--red:#ef4444;--yellow:#eab308;--blue:#3b82f6}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
header{background:var(--surface);border-bottom:1px solid var(--border);padding:1rem 2rem;display:flex;align-items:center;justify-content:space-between}
header h1{font-size:1.25rem;font-weight:600}
header h1 span{color:var(--accent)}
.controls{display:flex;gap:.75rem;align-items:center;flex-wrap:wrap}
.controls input,.controls select{background:var(--bg);border:1px solid var(--border);color:var(--text);padding:.4rem .75rem;border-radius:6px;font-size:.85rem}
.controls input:focus,.controls select:focus{outline:none;border-color:var(--accent)}
.btn{padding:.4rem 1rem;border:none;border-radius:6px;cursor:pointer;font-size:.85rem;font-weight:500;transition:opacity .15s}
.btn:hover{opacity:.85}
.btn-primary{background:var(--accent);color:#fff}
.btn-danger{background:var(--red);color:#fff}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--muted)}
main{padding:1.5rem 2rem}
.stats{display:flex;gap:1rem;margin-bottom:1.25rem}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:.75rem 1.25rem;min-width:120px}
.stat-label{font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.stat-value{font-size:1.5rem;font-weight:700}
table{width:100%;border-collapse:collapse;background:var(--surface);border-radius:8px;overflow:hidden;border:1px solid var(--border)}
thead th{background:var(--bg);text-align:left;padding:.65rem 1rem;font-size:.75rem;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);border-bottom:1px solid var(--border)}
tbody tr{border-bottom:1px solid var(--border);transition:background .1s}
tbody tr:last-child{border-bottom:none}
tbody tr:hover{background:rgba(108,99,255,.06)}
tbody td{padding:.6rem 1rem;font-size:.85rem;vertical-align:top}
.method{font-weight:700;font-size:.75rem;padding:.15rem .5rem;border-radius:4px;display:inline-block;min-width:52px;text-align:center}
.method-get{background:rgba(59,130,246,.15);color:var(--blue)}
.method-post{background:rgba(34,197,94,.15);color:var(--green)}
.method-put{background:rgba(234,179,8,.15);color:var(--yellow)}
.method-patch{background:rgba(234,179,8,.15);color:var(--yellow)}
.method-delete{background:rgba(239,68,68,.15);color:var(--red)}
.status{font-weight:600;font-variant-numeric:tabular-nums}
.status-2xx{color:var(--green)}
.status-3xx{color:var(--blue)}
.status-4xx{color:var(--yellow)}
.status-5xx{color:var(--red)}
.path-cell{font-family:'SF Mono',SFMono-Regular,Consolas,monospace;font-size:.8rem}
.timestamp{color:var(--muted);font-size:.8rem;white-space:nowrap}
.mock-key{font-family:'SF Mono',SFMono-Regular,Consolas,monospace;font-size:.75rem;color:var(--accent)}
.no-match{color:var(--muted);font-style:italic}
.details-toggle{cursor:pointer;color:var(--accent);font-size:.75rem;text-decoration:underline}
.details-row td{padding:0 1rem .75rem;background:rgba(108,99,255,.04)}
.details-content{display:grid;grid-template-columns:1fr 1fr;gap:1rem;padding:.75rem 0}
.details-section h4{font-size:.7rem;text-transform:uppercase;color:var(--muted);margin-bottom:.35rem;letter-spacing:.5px}
.details-section pre{background:var(--bg);padding:.5rem .75rem;border-radius:6px;font-size:.75rem;overflow-x:auto;white-space:pre-wrap;word-break:break-all;max-height:200px;border:1px solid var(--border)}
.empty-state{text-align:center;padding:3rem;color:var(--muted)}
.empty-state p{margin-top:.5rem;font-size:.9rem}
.redacted{color:var(--red);font-style:italic}
.auto-refresh{display:flex;align-items:center;gap:.35rem;font-size:.8rem;color:var(--muted)}
.auto-refresh input[type=checkbox]{accent-color:var(--accent)}
@media(max-width:900px){
  header{flex-direction:column;gap:.75rem;align-items:stretch}
  .controls{flex-direction:column}
  .stats{flex-wrap:wrap}
  .details-content{grid-template-columns:1fr}
}
</style>
</head>
<body>
<header>
  <h1>🧩 <span>Mimic</span> Request Dashboard</h1>
  <div class="controls">
    <input type="text" id="filter-path" placeholder="Filter by path…">
    <select id="filter-method">
      <option value="">All methods</option>
      <option value="GET">GET</option>
      <option value="POST">POST</option>
      <option value="PUT">PUT</option>
      <option value="PATCH">PATCH</option>
      <option value="DELETE">DELETE</option>
    </select>
    <select id="filter-status">
      <option value="">All statuses</option>
      <option value="200">200</option>
      <option value="201">201</option>
      <option value="204">204</option>
      <option value="400">400</option>
      <option value="404">404</option>
      <option value="500">500</option>
    </select>
    <button class="btn btn-primary" onclick="fetchRequests()">Refresh</button>
    <button class="btn btn-danger" onclick="clearHistory()">Clear History</button>
    <label class="auto-refresh">
      <input type="checkbox" id="auto-refresh" checked> Auto-refresh
    </label>
  </div>
</header>
<main>
  <div class="stats">
    <div class="stat"><div class="stat-label">Total</div><div class="stat-value" id="stat-total">0</div></div>
    <div class="stat"><div class="stat-label">Matched</div><div class="stat-value status-2xx" id="stat-matched">0</div></div>
    <div class="stat"><div class="stat-label">Unmatched</div><div class="stat-value status-4xx" id="stat-unmatched">0</div></div>
  </div>
  <div id="table-container"></div>
</main>
<script>
(function(){
  const API = '/admin/requests';
  let refreshTimer = null;
  let expandedRows = new Set();

  function qs(id){ return document.getElementById(id); }

  function statusClass(s){
    if(s>=200&&s<300) return 'status-2xx';
    if(s>=300&&s<400) return 'status-3xx';
    if(s>=400&&s<500) return 'status-4xx';
    return 'status-5xx';
  }

  function methodClass(m){
    return 'method method-' + m.toLowerCase();
  }

  function escapeHtml(str){
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  function formatHeaders(headers){
    if(!headers||Object.keys(headers).length===0) return '<span style="color:var(--muted)">—</span>';
    return Object.entries(headers).map(function(e){
      var k=e[0], v=e[1];
      var val = v === '[REDACTED]'
        ? '<span class="redacted">[REDACTED]</span>'
        : escapeHtml(v);
      return '<strong>'+escapeHtml(k)+':</strong> '+val;
    }).join('\n');
  }

  function formatBody(body){
    if(!body) return '<span style="color:var(--muted)">—</span>';
    try{
      return escapeHtml(JSON.stringify(JSON.parse(body),null,2));
    }catch(e){
      return escapeHtml(body);
    }
  }

  function formatQueryParams(params){
    if(!params||Object.keys(params).length===0) return '<span style="color:var(--muted)">—</span>';
    return Object.entries(params).map(function(e){
      return escapeHtml(e[0])+'='+escapeHtml(e[1]);
    }).join('\n');
  }

  function toggleRow(id){
    if(expandedRows.has(id)) expandedRows.delete(id);
    else expandedRows.add(id);
    renderTable(window._lastData||[]);
  }

  // Expose globally for onclick
  window.toggleRow = toggleRow;

  function renderTable(requests){
    window._lastData = requests;
    var total = requests.length;
    var matched = requests.filter(function(r){return r.matched_mock;}).length;
    qs('stat-total').textContent = total;
    qs('stat-matched').textContent = matched;
    qs('stat-unmatched').textContent = total - matched;

    if(total===0){
      qs('table-container').innerHTML = '<div class="empty-state"><p>No requests recorded yet.</p><p>Send requests to your mock endpoints and they will appear here.</p></div>';
      return;
    }

    var html = '<table><thead><tr><th>#</th><th>Method</th><th>Path</th><th>Status</th><th>Mock</th><th>Timestamp</th><th></th></tr></thead><tbody>';
    for(var i=requests.length-1;i>=0;i--){
      var r = requests[i];
      var expanded = expandedRows.has(r.id);
      html += '<tr>'
        +'<td>'+r.id+'</td>'
        +'<td><span class="'+methodClass(r.method)+'">'+escapeHtml(r.method)+'</span></td>'
        +'<td class="path-cell">'+escapeHtml(r.path)+'</td>'
        +'<td><span class="status '+statusClass(r.response_status)+'">'+r.response_status+'</span></td>'
        +'<td>'+(r.matched_mock?'<span class="mock-key">'+escapeHtml(r.matched_mock)+'</span>':'<span class="no-match">none</span>')+'</td>'
        +'<td class="timestamp">'+escapeHtml(r.timestamp)+'</td>'
        +'<td><span class="details-toggle" onclick="toggleRow('+r.id+')">'+(expanded?'Hide':'Details')+'</span></td>'
        +'</tr>';
      if(expanded){
        html += '<tr class="details-row"><td colspan="7"><div class="details-content">'
          +'<div class="details-section"><h4>Headers</h4><pre>'+formatHeaders(r.headers)+'</pre></div>'
          +'<div class="details-section"><h4>Query Params</h4><pre>'+formatQueryParams(r.query_params)+'</pre></div>'
          +'<div class="details-section"><h4>Body</h4><pre>'+formatBody(r.body)+'</pre></div>'
          +'</div></td></tr>';
      }
    }
    html += '</tbody></table>';
    qs('table-container').innerHTML = html;
  }

  function buildUrl(){
    var params = [];
    var path = qs('filter-path').value.trim();
    var method = qs('filter-method').value;
    var status = qs('filter-status').value;
    if(path) params.push('path='+encodeURIComponent(path));
    if(method) params.push('method='+encodeURIComponent(method));
    if(status) params.push('status='+encodeURIComponent(status));
    return API + (params.length ? '?'+params.join('&') : '');
  }

  function fetchRequests(){
    fetch(buildUrl())
      .then(function(res){ return res.json(); })
      .then(function(data){ renderTable(data.requests||[]); })
      .catch(function(err){ console.error('Failed to fetch requests:', err); });
  }

  function clearHistory(){
    if(!confirm('Clear all recorded requests?')) return;
    fetch(API,{method:'DELETE'})
      .then(function(){
        expandedRows.clear();
        fetchRequests();
      })
      .catch(function(err){ console.error('Failed to clear requests:', err); });
  }

  // Expose globally for onclick
  window.fetchRequests = fetchRequests;
  window.clearHistory = clearHistory;

  // Auto-refresh
  function startAutoRefresh(){
    stopAutoRefresh();
    refreshTimer = setInterval(fetchRequests, 3000);
  }
  function stopAutoRefresh(){
    if(refreshTimer){ clearInterval(refreshTimer); refreshTimer=null; }
  }
  qs('auto-refresh').addEventListener('change',function(){
    if(this.checked) startAutoRefresh(); else stopAutoRefresh();
  });

  // Filter on input change
  qs('filter-path').addEventListener('input', fetchRequests);
  qs('filter-method').addEventListener('change', fetchRequests);
  qs('filter-status').addEventListener('change', fetchRequests);

  // Initial load
  fetchRequests();
  startAutoRefresh();
})();
</script>
</body>
</html>
