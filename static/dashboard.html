<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mimic – Admin Dashboard</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
/* Dark is the default palette; the light one is applied when the OS asks for
   it, and either can be forced with the header toggle (data-theme on <html>). */
:root{--bg:#0f1117;--surface:#1a1d27;--raised:#232735;--border:#2a2d3a;--text:#e1e4ed;--muted:#8b8fa3;--accent:#6c63ff;--green:#22c55e;--red:#ef4444;--yellow:#eab308;--blue:#3b82f6;--tint:rgba(108,99,255,.06)}
@media(prefers-color-scheme:light){
  :root{--bg:#f5f6fa;--surface:#fff;--raised:#f0f1f6;--border:#dcdfe8;--text:#1a1d27;--muted:#6b7080;--accent:#5b52e8;--green:#15803d;--red:#dc2626;--yellow:#a16207;--blue:#1d4ed8;--tint:rgba(91,82,232,.05)}
}
:root[data-theme=dark]{--bg:#0f1117;--surface:#1a1d27;--raised:#232735;--border:#2a2d3a;--text:#e1e4ed;--muted:#8b8fa3;--accent:#6c63ff;--green:#22c55e;--red:#ef4444;--yellow:#eab308;--blue:#3b82f6;--tint:rgba(108,99,255,.06)}
:root[data-theme=light]{--bg:#f5f6fa;--surface:#fff;--raised:#f0f1f6;--border:#dcdfe8;--text:#1a1d27;--muted:#6b7080;--accent:#5b52e8;--green:#15803d;--red:#dc2626;--yellow:#a16207;--blue:#1d4ed8;--tint:rgba(91,82,232,.05)}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
header{background:var(--surface);border-bottom:1px solid var(--border);padding:.85rem 2rem;display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap}
header h1{font-size:1.15rem;font-weight:600;white-space:nowrap}
header h1 span{color:var(--accent)}
.summary{display:flex;gap:1.25rem;flex-wrap:wrap;font-size:.78rem;color:var(--muted)}
.summary b{color:var(--text);font-weight:600}
.controls{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}
.controls input,.controls select{background:var(--bg);border:1px solid var(--border);color:var(--text);padding:.35rem .7rem;border-radius:6px;font-size:.82rem}
.controls input:focus,.controls select:focus{outline:none;border-color:var(--accent)}
.btn{padding:.35rem .9rem;border:none;border-radius:6px;cursor:pointer;font-size:.82rem;font-weight:500;transition:opacity .15s;font-family:inherit}
.btn:hover{opacity:.85}
.btn-primary{background:var(--accent);color:#fff}
.btn-danger{background:var(--red);color:#fff}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--muted)}
.btn-sm{padding:.15rem .5rem;font-size:.72rem}
nav.tabs{background:var(--surface);border-bottom:1px solid var(--border);padding:0 2rem;display:flex;gap:.25rem}
nav.tabs button{background:none;border:none;border-bottom:2px solid transparent;color:var(--muted);padding:.6rem 1rem;font-size:.88rem;font-weight:500;cursor:pointer;font-family:inherit}
nav.tabs button:hover{color:var(--text)}
nav.tabs button.active{color:var(--accent);border-bottom-color:var(--accent)}
main{padding:1.25rem 2rem 3rem}
.panel[hidden]{display:none}
.toolbar{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;margin-bottom:1rem}
.stats{display:flex;gap:1rem;margin-bottom:1.1rem;flex-wrap:wrap}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:.6rem 1.1rem;min-width:110px}
.stat-label{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.stat-value{font-size:1.35rem;font-weight:700}
table{width:100%;border-collapse:collapse;background:var(--surface);border-radius:8px;overflow:hidden;border:1px solid var(--border)}
thead th{background:var(--bg);text-align:left;padding:.6rem 1rem;font-size:.72rem;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);border-bottom:1px solid var(--border)}
tbody{border-bottom:1px solid var(--border)}
tbody:last-child{border-bottom:none}
tbody tr:hover{background:var(--tint)}
tbody td{padding:.55rem 1rem;font-size:.83rem;vertical-align:top}
.method{font-weight:700;font-size:.72rem;padding:.1rem .45rem;border-radius:4px;display:inline-block;min-width:52px;text-align:center}
.method-get{background:rgba(59,130,246,.15);color:var(--blue)}
.method-post{background:rgba(34,197,94,.15);color:var(--green)}
.method-put{background:rgba(234,179,8,.15);color:var(--yellow)}
.method-patch{background:rgba(234,179,8,.15);color:var(--yellow)}
.method-delete{background:rgba(239,68,68,.15);color:var(--red)}
.status{font-weight:600;font-variant-numeric:tabular-nums}
.status-2xx{color:var(--green)}
.status-3xx{color:var(--blue)}
.status-4xx{color:var(--yellow)}
.status-5xx{color:var(--red)}
.mono,.path-cell{font-family:'SF Mono',SFMono-Regular,Consolas,monospace;font-size:.79rem}
.timestamp{color:var(--muted);font-size:.78rem;white-space:nowrap}
.mock-key{font-family:'SF Mono',SFMono-Regular,Consolas,monospace;font-size:.74rem;color:var(--accent)}
.no-match{color:var(--muted);font-style:italic}
.details-toggle{cursor:pointer;color:var(--accent);font-size:.74rem;text-decoration:underline;background:none;border:none;font-family:inherit;padding:0}
.details-row td{padding:0 1rem .75rem;background:var(--tint)}
.details-content{display:grid;grid-template-columns:1fr 1fr;gap:1rem;padding:.75rem 0}
.details-section h4{font-size:.68rem;text-transform:uppercase;color:var(--muted);margin-bottom:.3rem;letter-spacing:.5px}
.details-section pre{background:var(--bg);padding:.5rem .75rem;border-radius:6px;font-size:.74rem;overflow-x:auto;white-space:pre-wrap;word-break:break-word;max-height:220px;border:1px solid var(--border)}
.wide{grid-column:1/-1}
.empty-state{text-align:center;padding:3rem;color:var(--muted);background:var(--surface);border:1px solid var(--border);border-radius:8px}
.empty-state p{margin-top:.5rem;font-size:.88rem}
.redacted{color:var(--red);font-style:italic}
.explain{color:var(--text);background:var(--bg);border-left:3px solid var(--accent)}
.auto-refresh{display:flex;align-items:center;gap:.3rem;font-size:.8rem;color:var(--muted);white-space:nowrap}
.auto-refresh input[type=checkbox]{accent-color:var(--accent)}
.badge{display:inline-block;font-size:.68rem;font-weight:600;padding:.05rem .4rem;border-radius:4px;background:var(--raised);color:var(--muted);border:1px solid var(--border);margin-right:.25rem}
.badge-on{background:rgba(108,99,255,.15);color:var(--accent);border-color:transparent}
.badge-warn{background:rgba(230,150,40,.18);color:#e69628;border-color:transparent}
.new-banner{display:none;margin-bottom:.75rem;padding:.45rem .9rem;border-radius:6px;background:var(--accent);color:#fff;font-size:.82rem;cursor:pointer;border:none;font-family:inherit;font-weight:500}
.new-banner.visible{display:block}
.paused-note{font-size:.75rem;color:var(--muted);margin-left:.5rem}
.load-more{text-align:center;margin-top:.75rem}
.toast{position:fixed;bottom:1.25rem;left:50%;transform:translateX(-50%);background:var(--accent);color:#fff;padding:.5rem 1rem;border-radius:6px;font-size:.82rem;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.visible{opacity:1}
@media(max-width:900px){
  header{flex-direction:column;align-items:stretch}
  main,nav.tabs,header{padding-left:1rem;padding-right:1rem}
  .details-content{grid-template-columns:1fr}
}
</style>
</head>
<body>
<header>
  <h1>🧩 <span>Mimic</span> Admin</h1>
  <div class="summary" id="summary">
    <span>Mocks <b id="sum-mocks">–</b></span>
    <span>Uptime <b id="sum-uptime">–</b></span>
    <span>Port <b id="sum-port">–</b></span>
    <span>Max body <b id="sum-body">–</b></span>
    <span>Version <b id="sum-version">–</b></span>
  </div>
  <button class="btn btn-outline" id="theme-toggle" title="Toggle colour theme">🌗 Theme</button>
</header>

<nav class="tabs">
  <button data-tab="requests" class="active">Requests</button>
  <button data-tab="mocks">Mocks</button>
  <button data-tab="sequences">Sequences</button>
</nav>

<main>
  <!-- ── Requests ─────────────────────────────────────────────────────── -->
  <section class="panel" id="panel-requests">
    <div class="toolbar controls">
      <input type="text" id="filter-path" placeholder="Path contains…">
      <select id="filter-method">
        <option value="">All methods</option>
        <option value="GET">GET</option>
        <option value="POST">POST</option>
        <option value="PUT">PUT</option>
        <option value="PATCH">PATCH</option>
        <option value="DELETE">DELETE</option>
        <option value="HEAD">HEAD</option>
        <option value="OPTIONS">OPTIONS</option>
      </select>
      <input type="text" id="filter-status" list="status-options" placeholder="Status (404, 4xx)" size="14">
      <datalist id="status-options">
        <option value="2xx"><option value="3xx"><option value="4xx"><option value="5xx">
        <option value="200"><option value="201"><option value="204"><option value="400"><option value="404"><option value="500">
      </datalist>
      <input type="text" id="filter-search" placeholder="Search body & headers…">
      <label class="auto-refresh"><input type="checkbox" id="filter-unmatched"> Unmatched only</label>
      <button class="btn btn-primary" id="btn-refresh-requests">Refresh</button>
      <button class="btn btn-outline" id="btn-export">Export log</button>
      <button class="btn btn-danger" id="btn-clear">Clear</button>
      <label class="auto-refresh"><input type="checkbox" id="auto-refresh" checked> Auto-refresh</label>
      <span class="paused-note" id="paused-note" hidden>paused — pointer over table</span>
    </div>
    <div class="stats">
      <div class="stat"><div class="stat-label">Shown</div><div class="stat-value" id="stat-total">0</div></div>
      <div class="stat"><div class="stat-label">Matched</div><div class="stat-value status-2xx" id="stat-matched">0</div></div>
      <div class="stat"><div class="stat-label">Unmatched</div><div class="stat-value status-4xx" id="stat-unmatched">0</div></div>
    </div>
    <button class="new-banner" id="new-banner"></button>
    <div id="requests-container"></div>
    <div class="load-more" id="requests-load-more" hidden>
      <button class="btn btn-outline" id="btn-load-more">Load older requests</button>
    </div>
  </section>

  <!-- ── Mocks ────────────────────────────────────────────────────────── -->
  <section class="panel" id="panel-mocks" hidden>
    <div class="toolbar controls">
      <input type="text" id="mock-search" placeholder="Filter mocks by path, method or file…">
      <button class="btn btn-primary" id="btn-refresh-mocks">Refresh</button>
    </div>
    <div class="stats">
      <div class="stat"><div class="stat-label">Loaded</div><div class="stat-value" id="stat-mocks">0</div></div>
      <div class="stat"><div class="stat-label">Total hits</div><div class="stat-value" id="stat-hits">0</div></div>
    </div>
    <div id="mocks-container"></div>
  </section>

  <!-- ── Sequences ────────────────────────────────────────────────────── -->
  <section class="panel" id="panel-sequences" hidden>
    <div class="toolbar controls">
      <button class="btn btn-primary" id="btn-refresh-sequences">Refresh</button>
      <button class="btn btn-danger" id="btn-reset-all">Reset all</button>
    </div>
    <div id="sequences-container"></div>
  </section>
</main>

<div class="toast" id="toast"></div>

<script>
(function(){
  'use strict';

  var API_REQUESTS  = '/admin/requests';
  var API_MOCKS     = '/admin/mocks';
  var API_SEQUENCES = '/admin/sequences';
  var API_RESET     = '/admin/sequences/reset';
  var API_HEALTH    = '/health';
  var REFRESH_INTERVAL_MS = 3000;
  // The page size /admin/requests defaults to server-side (#111) — kept in
  // sync here so "Load older" grows by the same increment the first page
  // already used.
  var DEFAULT_PAGE_LIMIT = 50;

  var refreshTimer = null;
  var activeTab = 'requests';
  // Rendered request rows, keyed by record id: the dashboard appends to this
  // rather than rebuilding the table, so an expanded row and the text you were
  // selecting survive a refresh.
  var rows = {};
  var expanded = {};
  var lastFilterKey = null;
  var pointerOverTable = false;
  var pendingRecords = null;
  var pendingTotal = 0;
  var lastRecords = [];
  var mocksCache = [];
  // How many of the most recent matching requests to fetch. Grows via "Load
  // older requests" rather than jumping straight to everything (#111) — a
  // filter change resets it back to the default.
  var pageLimit = DEFAULT_PAGE_LIMIT;

  function qs(id){ return document.getElementById(id); }

  // ── formatting helpers ──────────────────────────────────────────────
  function escapeHtml(str){
    var d = document.createElement('div');
    d.textContent = str === null || str === undefined ? '' : String(str);
    return d.innerHTML;
  }
  function statusClass(s){
    if(s>=200&&s<300) return 'status-2xx';
    if(s>=300&&s<400) return 'status-3xx';
    if(s>=400&&s<500) return 'status-4xx';
    return 'status-5xx';
  }
  function methodClass(m){ return 'method method-' + String(m).toLowerCase(); }
  function dash(){ return '<span style="color:var(--muted)">—</span>'; }

  function formatHeaders(headers){
    if(!headers || Object.keys(headers).length===0) return dash();
    return Object.keys(headers).sort().map(function(k){
      var v = headers[k];
      var val = v === '[REDACTED]'
        ? '<span class="redacted">[REDACTED]</span>'
        : escapeHtml(v);
      return '<strong>'+escapeHtml(k)+':</strong> '+val;
    }).join('\n');
  }
  function formatBody(body){
    if(body === null || body === undefined || body === '') return dash();
    try{ return escapeHtml(JSON.stringify(JSON.parse(body),null,2)); }
    catch(e){ return escapeHtml(body); }
  }
  function formatPairs(pairs){
    if(!pairs || Object.keys(pairs).length===0) return dash();
    // A query param's value is a list of every occurrence the client sent
    // (#108) — a plain string is accepted too, for a log written before that.
    return Object.keys(pairs).sort().map(function(k){
      var values = Array.isArray(pairs[k]) ? pairs[k] : [pairs[k]];
      return escapeHtml(k)+'='+values.map(escapeHtml).join(', ');
    }).join('\n');
  }
  function formatDuration(seconds){
    if(seconds === null || seconds === undefined) return '–';
    var s = Math.floor(seconds), d = Math.floor(s/86400), h = Math.floor(s%86400/3600),
        m = Math.floor(s%3600/60), r = s%60;
    if(d) return d+'d '+h+'h';
    if(h) return h+'h '+m+'m';
    if(m) return m+'m '+r+'s';
    return r+'s';
  }
  function formatBytes(n){
    if(n === null || n === undefined) return '–';
    if(n >= 1048576) return (n/1048576).toFixed(n%1048576?1:0)+' MB';
    if(n >= 1024) return (n/1024).toFixed(n%1024?1:0)+' KB';
    return n+' B';
  }
  function toast(message){
    var el = qs('toast');
    el.textContent = message;
    el.classList.add('visible');
    setTimeout(function(){ el.classList.remove('visible'); }, 1800);
  }

  // ── theme ───────────────────────────────────────────────────────────
  // The stored preference wins over prefers-color-scheme; with nothing stored
  // the OS decides and no attribute is set at all.
  function storedTheme(){
    try{ return localStorage.getItem('mimic-theme'); }catch(e){ return null; }
  }
  function applyTheme(theme){
    if(theme) document.documentElement.setAttribute('data-theme', theme);
    else document.documentElement.removeAttribute('data-theme');
  }
  function currentTheme(){
    var stored = storedTheme();
    if(stored) return stored;
    return window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  }
  applyTheme(storedTheme());
  qs('theme-toggle').addEventListener('click', function(){
    var next = currentTheme() === 'dark' ? 'light' : 'dark';
    try{ localStorage.setItem('mimic-theme', next); }catch(e){}
    applyTheme(next);
  });

  // ── tabs ────────────────────────────────────────────────────────────
  Array.prototype.forEach.call(document.querySelectorAll('nav.tabs button'), function(btn){
    btn.addEventListener('click', function(){
      activeTab = btn.getAttribute('data-tab');
      Array.prototype.forEach.call(document.querySelectorAll('nav.tabs button'), function(b){
        b.classList.toggle('active', b === btn);
      });
      ['requests','mocks','sequences'].forEach(function(name){
        qs('panel-'+name).hidden = (name !== activeTab);
      });
      refreshActiveTab();
    });
  });

  // ── header summary (from /health) ────────────────────────────────────
  function fetchHealth(){
    fetch(API_HEALTH).then(function(r){ return r.json(); }).then(function(h){
      qs('sum-mocks').textContent   = (h.mock_count !== undefined ? h.mock_count : h.mocks_loaded);
      qs('sum-uptime').textContent  = formatDuration(h.uptime_seconds);
      qs('sum-port').textContent    = h.port !== undefined ? h.port : '–';
      qs('sum-body').textContent    = formatBytes(h.max_body_size);
      qs('sum-version').textContent = h.version || '–';
    }).catch(function(){ /* the summary bar is decoration; never block on it */ });
  }

  // ── requests tab ────────────────────────────────────────────────────

  // The filter part of the URL only — used to tell "the same view, more
  // results" (a growing pageLimit) apart from "a different view entirely"
  // (a changed box), which need different reactions from fetchRequests.
  function requestFilterParams(){
    var params = [];
    var path = qs('filter-path').value.trim();
    var method = qs('filter-method').value;
    var status = qs('filter-status').value.trim();
    var search = qs('filter-search').value.trim();
    if(path)   params.push('path='+encodeURIComponent(path));
    if(method) params.push('method='+encodeURIComponent(method));
    if(status) params.push('status='+encodeURIComponent(status));
    if(search) params.push('search='+encodeURIComponent(search));
    if(qs('filter-unmatched').checked) params.push('unmatched_only=true');
    return params;
  }

  // `limit` lets a caller ask for a specific page size — `0` for "every
  // match", used by Export log — overriding the incrementally-growing
  // `pageLimit` normal polling uses.
  function buildRequestsUrl(limit){
    var params = requestFilterParams();
    params.push('limit=' + (limit === undefined ? pageLimit : limit));
    return API_REQUESTS + '?' + params.join('&');
  }

  function curlFor(r){
    var parts = ['curl -X ' + r.method];
    var url = window.location.origin + r.path;
    var query = [];
    Object.keys(r.query_params || {}).forEach(function(k){
      var values = Array.isArray(r.query_params[k]) ? r.query_params[k] : [r.query_params[k]];
      values.forEach(function(v){
        query.push(encodeURIComponent(k)+'='+encodeURIComponent(v));
      });
    });
    if(query.length) url += '?' + query.join('&');
    Object.keys(r.headers || {}).sort().forEach(function(k){
      // Redacted values were never stored, so the placeholder is all there is
      // to offer — left in deliberately, as a prompt to fill it in by hand.
      parts.push("-H '" + k + ': ' + String(r.headers[k]).replace(/'/g, "'\\''") + "'");
    });
    if(r.body) parts.push("-d '" + String(r.body).replace(/'/g, "'\\''") + "'");
    parts.push("'" + url + "'");
    return parts.join(' \\\n  ');
  }

  function copyText(text){
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){ toast('Copied to clipboard'); },
                                              function(){ toast('Copy failed'); });
      return;
    }
    var ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    try{ document.execCommand('copy'); toast('Copied to clipboard'); }
    catch(e){ toast('Copy failed'); }
    document.body.removeChild(ta);
  }

  function requestDetailsHtml(r){
    var responseStatus = '<span class="status '+statusClass(r.response_status)+'">'+r.response_status+'</span>';
    var matchLines = [];
    if(r.match_explanation) matchLines.push(escapeHtml(r.match_explanation));
    if(r.match_score !== undefined && r.match_score !== null) matchLines.push('score: '+r.match_score);
    if(r.path_params && Object.keys(r.path_params).length){
      matchLines.push('path params: '+Object.keys(r.path_params).sort().map(function(k){
        return escapeHtml(k)+'='+escapeHtml(r.path_params[k]);
      }).join(', '));
    }
    var matchHtml = matchLines.length ? matchLines.join('\n') : dash();

    return '<div class="details-content">'
      + '<div class="details-section"><h4>Request headers</h4><pre>'+formatHeaders(r.headers)+'</pre></div>'
      + '<div class="details-section"><h4>Query params</h4><pre>'+formatPairs(r.query_params)+'</pre></div>'
      + '<div class="details-section"><h4>Request body</h4><pre>'+formatBody(r.body)+'</pre></div>'
      + '<div class="details-section"><h4>Response headers</h4><pre>'+formatHeaders(r.response_headers)+'</pre></div>'
      + '<div class="details-section wide"><h4>Response ('+responseStatus+')</h4><pre>'+formatBody(r.response_body)+'</pre></div>'
      + '<div class="details-section wide"><h4>Match</h4><pre class="explain">'+matchHtml+'</pre></div>'
      + '</div>';
  }

  // One <tbody> per record keeps a row and its details block together, so
  // appending or pruning a record is a single DOM operation.
  function buildRequestRow(r){
    var tbody = document.createElement('tbody');
    tbody.setAttribute('data-id', r.id);
    renderRequestRow(tbody, r);
    return tbody;
  }

  function renderRequestRow(tbody, r){
    var isOpen = !!expanded[r.id];
    var html = '<tr>'
      + '<td>'+r.id+'</td>'
      + '<td><span class="'+methodClass(r.method)+'">'+escapeHtml(r.method)+'</span></td>'
      + '<td class="path-cell">'+escapeHtml(r.path)+'</td>'
      + '<td><span class="status '+statusClass(r.response_status)+'">'+r.response_status+'</span></td>'
      + '<td>'+(r.matched_mock
            ? '<span class="mock-key">'+escapeHtml(r.matched_mock)+'</span>'
            : '<span class="no-match">none</span>')+'</td>'
      + '<td class="timestamp">'+escapeHtml(r.timestamp)+'</td>'
      + '<td style="white-space:nowrap">'
        + '<button class="details-toggle" data-action="toggle">'+(isOpen?'Hide':'Details')+'</button> '
        + '<button class="btn btn-outline btn-sm" data-action="curl">curl</button>'
      + '</td></tr>';
    if(isOpen){
      html += '<tr class="details-row"><td colspan="7">'+requestDetailsHtml(r)+'</td></tr>';
    }
    tbody.innerHTML = html;
    tbody._record = r;
  }

  function ensureRequestsTable(){
    var container = qs('requests-container');
    var table = container.querySelector('table');
    if(!table){
      container.innerHTML = '<table><thead><tr><th>#</th><th>Method</th><th>Path</th>'
        + '<th>Status</th><th>Mock</th><th>Timestamp</th><th></th></tr></thead></table>';
      table = container.querySelector('table');
      // Pausing on hover is what stops the table jumping out from under the
      // pointer mid-click while auto-refresh is on.
      table.addEventListener('mouseenter', function(){ pointerOverTable = true; updatePausedNote(); });
      table.addEventListener('mouseleave', function(){
        pointerOverTable = false;
        updatePausedNote();
        flushPending();
      });
      table.addEventListener('click', function(ev){
        var btn = ev.target.closest('button[data-action]');
        if(!btn) return;
        var tbody = btn.closest('tbody');
        if(!tbody || !tbody._record) return;
        var record = tbody._record;
        if(btn.getAttribute('data-action') === 'toggle'){
          expanded[record.id] = !expanded[record.id];
          renderRequestRow(tbody, record);
        }else{
          copyText(curlFor(record));
        }
      });
    }
    return table;
  }

  function updatePausedNote(){
    qs('paused-note').hidden = !(pointerOverTable && qs('auto-refresh').checked);
  }

  // `total` is every match on the server, independent of how many of them
  // this page actually fetched (#111) — the "Shown" stat reads this, not
  // records.length, so it still reads "1000" even though only a page of
  // rows renders.
  function applyRequests(records, total){
    lastRecords = records;
    var container = qs('requests-container');
    var matched = records.filter(function(r){ return r.matched_mock; }).length;
    qs('stat-total').textContent = total;
    qs('stat-matched').textContent = matched;
    qs('stat-unmatched').textContent = records.length - matched;
    updateLoadMoreButton(total, records.length);

    if(records.length === 0){
      rows = {};
      container.innerHTML = total === 0
        ? '<div class="empty-state"><p>No requests recorded yet.</p>'
          + '<p>Send requests to your mock endpoints and they will appear here.</p></div>'
        : '<div class="empty-state"><p>Nothing in this page.</p></div>';
      return;
    }

    var table = ensureRequestsTable();
    var seen = {};
    // Newest first: walking ascending ids and prepending each new row leaves
    // the table in descending order without re-sorting anything.
    records.forEach(function(r){
      seen[r.id] = true;
      var existing = rows[r.id];
      if(existing){
        // A record is immutable once logged, so an existing row only needs
        // re-rendering when its expanded state changed — handled on click.
        existing._record = r;
        return;
      }
      var tbody = buildRequestRow(r);
      rows[r.id] = tbody;
      var first = table.querySelector('tbody');
      if(first) table.insertBefore(tbody, first);
      else table.appendChild(tbody);
    });
    Object.keys(rows).forEach(function(id){
      if(!seen[id]){
        if(rows[id].parentNode) rows[id].parentNode.removeChild(rows[id]);
        delete rows[id];
        delete expanded[id];
      }
    });
  }

  // Visible only while the current page hasn't already loaded every match —
  // clicking it grows `pageLimit` and re-fetches, which is a superset of
  // what's already shown (nothing already on screen ever disappears).
  function updateLoadMoreButton(total, shown){
    qs('requests-load-more').hidden = shown >= total;
  }

  function flushPending(){
    if(!pendingRecords) return;
    var records = pendingRecords;
    var total = pendingTotal;
    pendingRecords = null;
    qs('new-banner').classList.remove('visible');
    applyRequests(records, total);
  }

  function fetchRequests(){
    var key = requestFilterParams().join('&');
    if(key !== lastFilterKey){
      // A changed filter means a different result set, not more of the same —
      // start the table over and go back to the default page size, rather
      // than diffing against (or trying to grow) the old view.
      lastFilterKey = key;
      pageLimit = DEFAULT_PAGE_LIMIT;
      rows = {};
      pendingRecords = null;
      qs('new-banner').classList.remove('visible');
      qs('requests-container').innerHTML = '';
    }
    return fetch(buildRequestsUrl())
      .then(function(res){ return res.json(); })
      .then(function(data){
        var records = data.requests || [];
        var total = data.count || 0;
        if(pointerOverTable && Object.keys(rows).length){
          var added = records.filter(function(r){ return !rows[r.id]; }).length;
          var removed = Object.keys(rows).filter(function(id){
            return !records.some(function(r){ return String(r.id) === String(id); });
          }).length;
          if(added || removed){
            pendingRecords = records;
            pendingTotal = total;
            var banner = qs('new-banner');
            banner.textContent = added
              ? '↑ ' + added + ' new request' + (added === 1 ? '' : 's') + ' — click to show'
              : '↑ log updated — click to show';
            banner.classList.add('visible');
          }
          return;
        }
        applyRequests(records, total);
      })
      .catch(function(err){ console.error('Failed to fetch requests:', err); });
  }

  qs('new-banner').addEventListener('click', flushPending);

  qs('btn-load-more').addEventListener('click', function(){
    pageLimit += DEFAULT_PAGE_LIMIT;
    fetchRequests();
  });

  function clearHistory(){
    if(!confirm('Clear all recorded requests?')) return;
    fetch(API_REQUESTS,{method:'DELETE'})
      .then(function(){
        expanded = {};
        rows = {};
        pendingRecords = null;
        pageLimit = DEFAULT_PAGE_LIMIT;
        qs('new-banner').classList.remove('visible');
        qs('requests-container').innerHTML = '';
        fetchRequests();
      })
      .catch(function(err){ console.error('Failed to clear requests:', err); });
  }

  // Exports every match, not just the loaded page (#111) — a fresh request
  // with limit=0, independent of whatever pageLimit the table is currently
  // showing.
  function exportLog(){
    fetch(buildRequestsUrl(0))
      .then(function(res){ return res.json(); })
      .then(function(data){ downloadLog(data.requests || []); })
      .catch(function(err){
        console.error('Failed to export requests:', err);
        toast('Export failed — see console');
      });
  }

  function downloadLog(records){
    var blob = new Blob([JSON.stringify(records, null, 2)], {type:'application/json'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'mimic-requests-' + new Date().toISOString().replace(/[:.]/g,'-') + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  // ── mocks tab ───────────────────────────────────────────────────────
  function matcherBadges(m){
    var kinds = [['query_params','query'],['headers','headers'],['body','body']];
    var html = kinds.map(function(pair){
      var on = m.matchers && m.matchers[pair[0]];
      return '<span class="badge'+(on?' badge-on':'')+'">'+pair[1]+'</span>';
    }).join('');
    if(m.has_path_params) html += '<span class="badge badge-on">path params</span>';
    return html;
  }

  // Scenario tags, plus an explicit marker when the active scenario has
  // filtered this mock out — "loaded but unmatchable" is otherwise invisible.
  function tagBadges(m){
    var tags = m.tags || [];
    if(!tags.length) return '';
    var html = tags.map(function(t){
      return '<span class="badge'+(m.active===false?'':' badge-on')+'">'+escapeHtml(t)+'</span>';
    }).join('');
    if(m.active === false) html += '<span class="badge" title="filtered out by the active scenario">inactive</span>';
    return ' ' + html;
  }

  // A mock on a route Mimic answers itself never reaches the matcher, so it
  // has no entry in the request log to explain its permanent zero hits. This
  // badge is the only place that can say so.
  function unreachableBadge(m){
    if(m.reachable !== false) return '';
    var why = m.unreachable_reason || 'this route is reserved by Mimic';
    return ' <span class="badge badge-warn" title="'+escapeHtml(why)+'">unreachable</span>';
  }

  function renderMocks(){
    var needle = qs('mock-search').value.trim().toLowerCase();
    var list = mocksCache.filter(function(m){
      if(!needle) return true;
      return (m.path+' '+m.method+' '+(m.source||'')+' '+(m.tags||[]).join(' ')).toLowerCase().indexOf(needle) !== -1;
    });
    qs('stat-mocks').textContent = mocksCache.length;
    qs('stat-hits').textContent = mocksCache.reduce(function(a,m){ return a + (m.hits||0); }, 0);

    var container = qs('mocks-container');
    if(!list.length){
      container.innerHTML = '<div class="empty-state"><p>'
        + (mocksCache.length ? 'No mock matches this filter.' : 'No mocks loaded.')
        + '</p><p>Mock files live in the mocks directory and hot-reload every 2s.</p></div>';
      return;
    }

    var html = '<table><thead><tr><th>Method</th><th>Path</th><th>Status</th><th>Matchers</th>'
      + '<th>Delay</th><th>Sequence</th><th>Hits</th><th>Source</th><th></th></tr></thead>';
    list.forEach(function(m, i){
      var delay = m.delay_ms === null || m.delay_ms === undefined ? '—'
        : (typeof m.delay_ms === 'object' ? m.delay_ms.min+'–'+m.delay_ms.max+' ms' : m.delay_ms+' ms');
      var seq = m.sequence_steps ? m.sequence_steps + ' steps' : '—';
      // A single-file load leaves `source` unset; show a dash, not an empty cell.
      var source = m.source ? '<span class="mono">'+escapeHtml(m.source)+'</span>' : dash();
      html += '<tbody data-mock="'+i+'"><tr>'
        + '<td><span class="'+methodClass(m.method)+'">'+escapeHtml(m.method)+'</span></td>'
        + '<td class="path-cell">'+escapeHtml(m.path)+tagBadges(m)+unreachableBadge(m)+'</td>'
        + '<td><span class="status '+statusClass(m.status)+'">'+m.status+'</span></td>'
        + '<td>'+matcherBadges(m)+'</td>'
        + '<td>'+escapeHtml(delay)+'</td>'
        + '<td>'+escapeHtml(seq)+'</td>'
        + '<td>'+(m.hits||0)+'</td>'
        + '<td>'+source+'</td>'
        + '<td><button class="details-toggle" data-mock-toggle="'+i+'">Config</button></td>'
        + '</tr></tbody>';
    });
    html += '</table>';
    container.innerHTML = html;

    container.querySelectorAll('button[data-mock-toggle]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var tbody = btn.closest('tbody');
        var open = tbody.querySelector('.details-row');
        if(open){ tbody.removeChild(open); btn.textContent = 'Config'; return; }
        var mock = list[parseInt(btn.getAttribute('data-mock-toggle'), 10)];
        var tr = document.createElement('tr');
        tr.className = 'details-row';
        tr.innerHTML = '<td colspan="9"><div class="details-content">'
          + '<div class="details-section wide"><h4>'+escapeHtml(mock.key)+'</h4><pre>'
          + escapeHtml(JSON.stringify(mock.config, null, 2)) + '</pre></div></div></td>';
        tbody.appendChild(tr);
        btn.textContent = 'Hide';
      });
    });
  }

  function fetchMocks(){
    return fetch(API_MOCKS)
      .then(function(r){ return r.json(); })
      .then(function(data){ mocksCache = data.mocks || []; renderMocks(); })
      .catch(function(err){ console.error('Failed to fetch mocks:', err); });
  }

  // ── sequences tab ───────────────────────────────────────────────────
  function fetchSequences(){
    return fetch(API_SEQUENCES)
      .then(function(r){ return r.json(); })
      .then(function(data){
        var list = data.sequences || [];
        var container = qs('sequences-container');
        if(!list.length){
          container.innerHTML = '<div class="empty-state"><p>No sequences in progress.</p>'
            + '<p>A mock with a <code>sequence</code> appears here once it has served a request.</p></div>';
          return;
        }
        var html = '<table><thead><tr><th>Method</th><th>Path</th><th>Step</th>'
          + '<th>Source</th><th></th></tr></thead><tbody>';
        list.forEach(function(s){
          var step = s.total ? (Math.min(s.step, s.total) + ' / ' + s.total) : String(s.step);
          html += '<tr>'
            + '<td><span class="'+methodClass(s.method)+'">'+escapeHtml(s.method)+'</span></td>'
            + '<td class="path-cell">'+escapeHtml(s.path)+'</td>'
            + '<td class="mono">'+escapeHtml(step)+'</td>'
            + '<td>'+(s.source ? '<span class="mono">'+escapeHtml(s.source)+'</span>' : dash())+'</td>'
            + '<td><button class="btn btn-outline btn-sm" data-reset="'+escapeHtml(s.path)+'">Reset</button></td>'
            + '</tr>';
        });
        html += '</tbody></table>';
        container.innerHTML = html;
        container.querySelectorAll('button[data-reset]').forEach(function(btn){
          btn.addEventListener('click', function(){ resetSequence(btn.getAttribute('data-reset')); });
        });
      })
      .catch(function(err){ console.error('Failed to fetch sequences:', err); });
  }

  function resetSequence(path){
    var url = API_RESET + (path ? '?path=' + encodeURIComponent(path) : '');
    fetch(url, {method:'POST'})
      .then(function(r){ return r.json(); })
      .then(function(data){
        toast('Reset ' + data.reset + ' sequence counter(s)');
        fetchSequences();   // refresh in place, no page reload
      })
      .catch(function(err){ console.error('Failed to reset sequences:', err); });
  }

  // ── wiring ──────────────────────────────────────────────────────────
  function refreshActiveTab(){
    fetchHealth();
    if(activeTab === 'requests') return fetchRequests();
    if(activeTab === 'mocks') return fetchMocks();
    return fetchSequences();
  }

  qs('btn-refresh-requests').addEventListener('click', fetchRequests);
  qs('btn-refresh-mocks').addEventListener('click', fetchMocks);
  qs('btn-refresh-sequences').addEventListener('click', fetchSequences);
  qs('btn-clear').addEventListener('click', clearHistory);
  qs('btn-export').addEventListener('click', exportLog);
  qs('btn-reset-all').addEventListener('click', function(){
    if(confirm('Reset every sequence counter?')) resetSequence(null);
  });
  qs('mock-search').addEventListener('input', renderMocks);

  ['filter-path','filter-status','filter-search'].forEach(function(id){
    qs(id).addEventListener('input', fetchRequests);
  });
  qs('filter-method').addEventListener('change', fetchRequests);
  qs('filter-unmatched').addEventListener('change', fetchRequests);

  function startAutoRefresh(){
    stopAutoRefresh();
    refreshTimer = setInterval(refreshActiveTab, REFRESH_INTERVAL_MS);
  }
  function stopAutoRefresh(){
    if(refreshTimer){ clearInterval(refreshTimer); refreshTimer = null; }
  }
  qs('auto-refresh').addEventListener('change', function(){
    updatePausedNote();
    if(this.checked) startAutoRefresh(); else stopAutoRefresh();
  });

  refreshActiveTab();
  startAutoRefresh();
})();
</script>
</body>
</html>
